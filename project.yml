name: Cairn
options:
  bundleIdPrefix: dev.cairn
  developmentLanguage: fr
  deploymentTarget:
    macOS: "27.0"
packages:
  CairnCore:
    path: CairnCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.5.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cairn:
    type: application
    platform: macOS
    scheme: {}
    sources: [App]
    dependencies:
      - package: CairnCore
      - package: Sparkle
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Default notification style: alerts stay on screen until clicked (the user can still pick banners).
        NSUserNotificationAlertStyle: alert
        # Sparkle: the appcast is a file of the latest GitHub release; daily checks without asking first.
        SUFeedURL: https://github.com/guillaume5th/cairn/releases/latest/download/appcast.xml
        SUPublicEDKey: C5D91R2KSp/CwIli2HzinI/qFww79gbU+BWbbXYyBsw=
        SUEnableAutomaticChecks: true
        # Required by Sparkle in a sandboxed app (the download goes through network.client).
        SUEnableInstallerLauncherService: true
        # feed: links from sites and browsers open "Ajouter un abonnement" with the address.
        CFBundleURLTypes:
          - CFBundleURLName: Feed
            CFBundleURLSchemes: [feed]
        # Declares .opml files to the system, so the file picker offers them (an undeclared extension can be greyed out).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [opml]
              public.mime-type: [text/x-opml]
    entitlements:
      path: App/Cairn.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Ad-hoc signing + hardened runtime: without this, dyld refuses the embedded Sparkle.framework (no Team ID to match).
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Keeps access to the backup folder chosen once in Settings.
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle's installer talks to the app through these services.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cairn.Cairn
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cairn
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing: runs locally, no Apple developer account needed.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_MODULE_NAME: Cairn
      # Debug builds are a separate app ("Cairn Dev", orange icon): own library and settings, runs beside the stable one.
      configs:
        Debug:
          PRODUCT_NAME: Cairn Dev
          PRODUCT_BUNDLE_IDENTIFIER: dev.cairn.Cairn.debug
          INFOPLIST_KEY_CFBundleDisplayName: Cairn Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
