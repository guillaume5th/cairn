name: Cairn
options:
  bundleIdPrefix: dev.cairn
  developmentLanguage: fr
  deploymentTarget:
    macOS: "27.0"
packages:
  CairnCore:
    path: CairnCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cairn:
    type: application
    platform: macOS
    # Shared schemes: Xcode's auto-created ones drop one of the two targets that both build Cairn.app.
    scheme: {}
    sources: [App]
    dependencies:
      - package: CairnCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declares .opml files to the system, so the file picker offers them (an undeclared extension can be greyed out).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [opml]
              public.mime-type: [text/x-opml]
    entitlements:
      path: App/Cairn.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cairn.Cairn
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cairn
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing: runs locally, no Apple developer account needed.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
  Cairn iOS:
    type: application
    platform: iOS
    scheme: {}
    # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (not versioned).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    deploymentTarget: "27.0"
    sources: [App]
    dependencies:
      - package: CairnCore
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declares .opml files to the system, so the file picker offers them (an undeclared extension can be greyed out).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [opml]
              public.mime-type: [text/x-opml]
        # Plain http to an Ollama server on the local network; public http stays blocked by ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Cairn
        # Suffixed with the team: Apple refuses an iOS app ID already registered by another team.
        PRODUCT_BUNDLE_IDENTIFIER: dev.cairn.Cairn-$(DEVELOPMENT_TEAM)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cairn
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Cairn se connecte au serveur Ollama de ton réseau local pour rédiger les résumés.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
